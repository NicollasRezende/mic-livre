name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Python and shell syntax
        run: |
          python3 -m py_compile pc/*.py scripts/*.py
          bash -n build-apk.sh setup-linux.sh publicar-github.sh
          sh -n abrir-pc.sh iniciar-pc.sh
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Java tests and signed debug APK
        run: ./build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mic-livre-debug-apk
          path: dist/mic-livre.apk
